"vlink":"https:\u002F\u002Fyoutu.be\u002FsGJ5hDOLxYc","psmavgRt":4.666666666666667,"oc":"N","totRev":2,"pincode":"400051","psmRevlink":"https:\u002F\u002Fwww.youtube.com\u002Fembed\u002FsGJ5hDOLxYc","psmRevdesc":"\u003Cdiv\u003EHello everyone, and welcome to Mbtv's Project Review with me, Chetna Sadadekar. In today's episode we will review a newly launched project by Vaibhav Lakshmi Developers in Bandra East. The project is called Address 51. Stay tuned as we explore more details.\u003C\u002Fdiv\u003E\u003Cdiv\u003E\u003Cbr \u002F\u003E\u003C\u002Fdiv\u003E\u003Cdiv\u003EThe project is located in Khernagar Bandra east close to Western Express Highway. Thus it can be easily accessed from the south to suburban areas of Mumbai in 45 minutes to an hour.\u003C\u002Fdiv\u003E\u003Cdiv\u003E\u003Cbr \u002F\u003E\u003C\u002Fdiv\u003E\u003Cdiv\u003EAddress 51 is a redevelopment project with a total of 180 units, of which 60 units are reserved for all inhabitants, and the remaining 120 units are available for sale.\u003C\u002Fdiv\u003E\u003Cdiv\u003E\u003Cbr \u002F\u003E\u003C\u002Fdiv\u003E\u003Cdiv\u003ESpread across half an acre, the project will have two wings of 23 floors each, namely A and B wing. Each wing will have four flats on each floor barring the refuge areas. The rooftop of both the wings is reserved for various amenities and in terms of bedroom configurations, Address 51 offers 1 and 2 BHK with two options. One where you can buy a flat with a balcony and another without a balcony.\u003C\u002Fdiv\u003E\u003Cdiv\u003E\u003Cbr \u002F\u003E\u003C\u002Fdiv\u003E\u003Cdiv\u003EThe carpet area for 1BHK with a balcony is 442 sq ft, while for the one without a balcony is 410 sq ft. Similarly, a 585 sq ft 2 BHK apartment comes without a balcony and 619 Sqft will have a balcony. Both the wings will have two lifts and one staircase.\u003C\u002Fdiv\u003E\u003Cdiv\u003E\u003Cbr \u002F\u003E\u003C\u002Fdiv\u003E\u003Cdiv\u003EAddress 51 is RERA registered and is slated for completion in 2025. From the top floors of the project you can see Bandra Worli Sea Link from one side and a view of the highway on the other. Not just this, the project is bang opposite a BMC run garden, thus there is ample greenery around. According to the developer, all units in the project are east-west facing.\u003C\u002Fdiv\u003E\u003Cdiv\u003E\u003Cbr \u002F\u003E\u003C\u002Fdiv\u003E\u003Cdiv\u003EThe project offers several amenities, especially on the rooftop level as it will have a swimming pool, poolside lounge, a separate lounge area, senior citizen corner, etc. A multi-use area fitness center and an open to sky event lawn will also be offered to the residents in this project.\u003C\u002Fdiv\u003E\u003Cdiv\u003E\u003Cbr \u002F\u003E\u003C\u002Fdiv\u003E\u003Cdiv\u003EOne of the USPs of this project is a separate parking tower as the developer is offering one car parking space for each flat, for which the price is included in the overall cost. There will also be an electric vehicle, charging point and car wash area.\u003C\u002Fdiv\u003E\u003Cdiv\u003E\u003Cbr \u002F\u003E\u003C\u002Fdiv\u003E\u003Cdiv\u003EIt's now time to understand the unit plan and see if it fits your space needs or not. From the main door you will enter the living area that comes with French windows that open to a balcony. From here you can enjoy a view of the cityscape. The living area is spacious enough to accommodate a four seater sofa and a TV unit, and anything more than that would make the space look cramped up. Towards your left, near the entrance is a closed kitchen that has decent storage space but no separate utility area. Just outside the kitchen in the living area, you can set up a four seater dining table. Moving ahead, a small passage divides the bedroom and a common toilet and a bathroom. While the bathroom is on the left of the passage, the bedroom is on the right. You can have a queen size bed with a wardrobe in this bedroom and use it as a kid's room or even a guest room. Towards the end is a master bedroom which is about 15% bigger than the other room. In addition to a queen size bed and a wardrobe, it can accommodate side tables and a TV unit.\u003C\u002Fdiv\u003E\u003Cdiv\u003E\u003Cbr \u002F\u003E\u003C\u002Fdiv\u003E\u003Cdiv\u003EPlease note that the developer will only provide vitrified flooring tiles, granite platform with a sink in the kitchen doors, fittings and fixtures for bathrooms and toilets.\u003C\u002Fdiv\u003E\u003Cdiv\u003E\u003Cbr \u002F\u003E\u003C\u002Fdiv\u003E\u003Cdiv\u003ELet's now take a look at the prices for a 1 BHK measuring 410 sq ft without a balcony, the price starts at rupees 1.42 cr while for a 1 BHK with a balcony you will have to shell out rupees 1.58 Cr. The price for 2 BHK without a balcony starts at rupees 2.05 Cr while for an apartment with a balcony the price starts at rupees 2.16 Cr\u003C\u002Fdiv\u003E\u003Cdiv\u003E\u003Cbr \u002F\u003E\u003C\u002Fdiv\u003E\u003Cdiv\u003EThere is an interesting payment plan as a buyer would have to pay their money in six layer installments spread across various stages of the project completion. 20% is to be paid at booking, another 20% of the completion of 8th floor, the next 20% on the 23rd floor and another installment of 20% during brick work, whereas the next payment will come during the plumbing work and the last 10% on possession.\u003C\u002Fdiv\u003E\u003Cdiv\u003E\u003Cbr \u002F\u003E\u003C\u002Fdiv\u003E\u003Cdiv\u003EVaibhav Laxmi Developers have been in the real estate sector for over 25 years. They are an established name in the central suburbs of Mumbai with over eight ongoing projects in Vikhroli. So far the developer has completed 19 projects. Further, they also have two to three new projects in the pipeline.\u003C\u002Fdiv\u003E\u003Cdiv\u003E\u003Cbr \u002F\u003E\u003C\u002Fdiv\u003E\u003Cdiv\u003EMoving on, let's evaluate the locality and its surrounding infrastructure and also see how this project scores when compared to other neighboring projects.&nbsp;\u003C\u002Fdiv\u003E\u003Cdiv\u003E\u003Cbr \u002F\u003E\u003C\u002Fdiv\u003E\u003Cdiv\u003EThe locality is in a lot of demand from those working in BKC and looking to reside nearby. There is also a good demand for housing in Bandra East by those looking for an upgrade towards the little south side of Mumbai from the western suburbs of Andheri and Santacruz\u003C\u002Fdiv\u003E\u003Cdiv\u003E\u003Cbr \u002F\u003E\u003C\u002Fdiv\u003E\u003Cdiv\u003EThe locality houses many schools and colleges. The popular Raheja College of Architecture and Sheila Raheja College of Catering and Hotel Management is a stone's throw away from the project.\u003C\u002Fdiv\u003E\u003Cdiv\u003E\u003Cbr \u002F\u003E\u003C\u002Fdiv\u003E\u003Cdiv\u003EBandra east doesn't disappoint on the healthcare front as well. Gurunanak Hospital, Asian Heart Hospital and Lilavati Hospital are all nearby.\u003C\u002Fdiv\u003E\u003Cdiv\u003E\u003Cbr \u002F\u003E\u003C\u002Fdiv\u003E\u003Cdiv\u003EThough there are no malls in the vicinity, the locals here often visit Bandra West for shopping purposes. Jio World Drive and Bandra reclamation are two popular places for recreation. The popular MIG Cricket Club is nearly 1.2 km away from the project.\u003C\u002Fdiv\u003E\u003Cdiv\u003E\u003Cbr \u002F\u003E\u003C\u002Fdiv\u003E\u003Cdiv\u003EAddress. 51 is located centrally and is very close to the Western Express Highway which is a major approach road to the project. It is also located close to Bandra station which is at a walking distance of about ten minutes. Even the Bandra train terminus for the long distance trains is about 2 km from the project. You will easily find autos, cabs and buses around the project. One can reach the Chhatrapati Shivaji Maharaj International Airport in about 15 to 20 minutes.\u003C\u002Fdiv\u003E\u003Cdiv\u003E\u003Cbr \u002F\u003E\u003C\u002Fdiv\u003E\u003Cdiv\u003EThe locality has projects like Rustamji Erica and Shapoorji Pallonji BKC 28. Both Erica and BKC 28 offer 2 BHK flats whereas in Address 51 you can choose from 1 or 2 BHK. Out of the three, the flats in Erica are bigger which also makes it the most expensive one of the three. When it comes to the location advantages, all three projects are on par with each other. But if one wants to reside in a comparatively affordable place then Address 51 definitely evolves as a decent bet.\u003C\u002Fdiv\u003E\u003Cdiv\u003E\u003Cbr \u002F\u003E\u003C\u002Fdiv\u003E\u003Cdiv\u003EHowever, there are a few things to keep in mind. The locality faces a lot of traffic chaos. You will also find large slum pockets near the station area and near the highway of Bandra East locality.\u003C\u002Fdiv\u003E\u003Cdiv\u003E\u003Cbr \u002F\u003E\u003C\u002Fdiv\u003E\u003Cdiv\u003EThough the apartments come in decent sizes, I felt that the kitchen could have been slightly bigger as it lacks utility space. So this was my review about Address 51 and if you have any queries relating to the project, don't forget to write to me in the comment section below.\u003C\u002Fdiv\u003E\u003Cdiv\u003E\u003Cbr \u002F\u003E\u003C\u002Fdiv\u003E\u003Cdiv\u003EAlso do subscribe to MBTV if you haven't already done it. Till we meet again. This is Chetna Sadadekar signing off with cameraman Arpit Sharma.\u003C\u002Fdiv\u003E\u003Cdiv\u003E\u003Cbr \u002F\u003E\u003C\u002Fdiv\u003E","endDateT":"2022-09-16T18:30:00.000Z","psmDRanking":31,"psmRevVidChap":["Project location|35|\u002Fmb\u002Fimages\u002Fproject\u002Fthumbnail\u002F2022\u002F09\u002F17\u002FScreenshot-2022-09-17-140020.png","Explaining the unit plan of the 2 BHK (619 sf)|180|\u002Fmb\u002Fimages\u002Fproject\u002Fthumbnail\u002F2022\u002F09\u002F17\u002FScreenshot-2022-09-17-140325.png","Developers profile|321|\u002Fmb\u002Fimages\u002Fproject\u002Fthumbnail\u002F2022\u002F09\u002F17\u002FScreenshot-2022-09-17-141054.png","Amenities offered in Address 51|136|\u002Fmb\u002Fimages\u002Fproject\u002Fthumbnail\u002F2022\u002F09\u002F17\u002FScreenshot-202
